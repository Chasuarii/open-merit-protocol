services:
  # 1. Local Vector Database for anonymized Skill & Aptitude Vectors (zero raw user data)
  vector-db:
    image: qdrant/qdrant:latest
    container_name: omp-vector-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - omp_vector_data:/qdrant/storage
    networks:
      - omp_internal

  # 2. Core Adversarial Engine & Two-Sided Zero-Credential Router
  merit-engine:
    image: python:3.11-slim
    container_name: omp-merit-engine
    working_dir: /app
    volumes:
      - ./core:/app/core:ro
      - ./cartridges:/app/cartridges:ro
    environment:
      - PYTHONUNBUFFERED=1
      - VECTOR_DB_URL=http://vector-db:6333
      - STRICT_ZERO_CREDENTIALS=true
    depends_on:
      - vector-db
    command: ["python", "-m", "core.engine.router"]
    networks:
      - omp_internal

  # 3. Isolated Offline Cartridge Sandbox (e.g., Robotics Control Loop v1)
  sandbox-robotics:
    build:
      context: ./cartridges/robotics_control_v1
      dockerfile: Dockerfile
    container_name: omp-sandbox-robotics
    network_mode: "none"          # Strict air-gap: sandboxes never get internet access
    read_only: true
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    profiles:
      - evaluation                # Runs on-demand when evaluating a candidate

networks:
  omp_internal:
    driver: bridge

volumes:
  omp_vector_data:
